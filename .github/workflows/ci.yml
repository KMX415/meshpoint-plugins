name: Plugin CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compatibility:
    name: Plugin compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KMX415/meshpoint
          ref: d476e29618dc2e1577cd137c3a282f9c3547edb1
          path: .compat/meshpoint
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: pip install -r .compat/meshpoint/requirements.txt ruff==0.15.22 pytest pytest-asyncio httpx
      - name: Validate catalog and source files
        run: |
          python -m unittest discover -s tests
          python scripts/validate.py --core .compat/meshpoint
          ruff check scripts/ tests/
      - name: Test plugins against pinned Meshpoint core
        run: |
          rsync -a --delete apps/ .compat/meshpoint/apps/
          cd .compat/meshpoint
          python -m pytest tests/ -q --ignore=tests/test_crypto_service.py --ignore=tests/test_meshtastic_decoder.py --ignore=tests/test_meshcore_decoder.py
          node --test tests/*.test.cjs
